name: NEPSE Market Refresh

on:
  schedule:
    # GitHub Actions supports a minimum scheduled interval of 5 minutes.
    - cron: '*/5 3-11 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch and normalize NEPSE data
        run: python scripts/refresh_market.py

      - name: Commit updated market snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/data/latest.json market-data/auto
          git diff --cached --quiet || git commit -m "chore: refresh automated NEPSE market data"
          git push
